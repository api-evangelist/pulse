description: >-
  Model Context Protocol posture for the Ivanti secure-access (former Pulse Secure) product
  family. Ivanti publishes no MCP server — hosted or stdio — for Ivanti Connect Secure,
  Ivanti Policy Secure or Ivanti Neurons for Zero Trust Access.
