description: >-
  Rate-limit posture for the Ivanti secure-access APIs. Ivanti publishes NO rate limits,
  quotas, throttling policy or rate-limit response headers for the Ivanti Connect Secure /
  Ivanti Policy Secure configuration REST API or the Ivanti Neurons for Zero Trust Access
  REST API. limit_count is an honest zero.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
policies: []
findings:
  - >-
    The provider's REST API Solutions Guide publishes an explicit "Error Codes Supported"
    table (200, 201, 204, 400, 401, 403, 404, 422, 500). 429 Too Many Requests is not in it,
    and no Retry-After behaviour is described.
  - >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented anywhere in the ICS/IPS
    guide or the nZTA API guide.
  - >-
    This is architecturally consistent rather than an omission: ICS and IPS are appliances
    the customer operates, so throughput is bounded by the appliance the caller owns, not by
    a vendor quota. nZTA is a hosted tenant and could carry limits, but none are published.
  - >-
    Practical consequence for an agent: there is no runtime backpressure signal on these
    APIs. A client must self-pace, and cannot distinguish appliance overload from throttling
    — 500 "the ICS/IPS rest server is not responding" is the only congestion signal
    documented.
