description: >-
  Pricing posture for the Ivanti secure-access (former Pulse Secure) product family. Ivanti
  publishes no public price list, no plan tiers and no self-serve sign-up for Connect
  Secure, Policy Secure or Neurons for Zero Trust Access. Everything routes to a sales
  conversation, so plan_count is an honest zero.
