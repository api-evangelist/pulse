api_pricing_note: >-
  The REST APIs are not a metered product. They are a management interface included with the
  appliance or tenant licence — there is no API plan to buy, and no API key to purchase
  independently of the product.
licensing_model:
  basis: >-
    Appliance / virtual-appliance licences plus subscription entitlements, administered
    through the product's own licence surface rather than a storefront.
  api_visibility: >-
    The licence state IS readable over the ICS API — /api/v1/license/named-users,
    /api/v1/license/license-clients, /api/v1/license/license-server-lease-information and
    /api/v1/license/report — and installed or removed with
    PUT /api/v1/license/license-key?action=install|delete. nZTA exposes
    /api/licenses/subscriptions/storage-consumption and
    /api/licenses/tenants/{tenant_id}/storage-consumption.
  source: https://help.ivanti.com/ps/help/en_US/ICS/22.x/apig/rest_api_soln_guide/ics_spec_configs__using_restapis.htm
