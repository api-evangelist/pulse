generated: '2026-08-29'
method: searched
source: https://help.ivanti.com/ps/help/en_US/ICS/25.1.x/25.1.3.0/25.xICSRN.pdf
description: >-
  Change history for Ivanti Connect Secure, read from the provider's published release
  notes. Ivanti does not run a dated web changelog for this product family — the record of
  change is a per-release PDF carrying its own dated revision-history table, plus a
  quarterly platform release page.
scheme: appliance-release
scheme_note: >-
  Releases are identified as YY.M.p.b (ICS 25.1.3.0) and the client as xx.yRn (ISAC 22.8R7).
  The REST API's own /v1 path segment has not moved; API change ships inside appliance
  releases, so the release notes are the only place API-affecting change is announced.
current_version: 25.1.3.0
current_version_date: '2026-07'
