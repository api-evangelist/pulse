  - url: https://help.ivanti.com/ps/help/en_US/ICS/25.1.x/25.1.3.0/25.xICSRN.pdf
    kind: release notes (PDF, per release)
    status: 200
  - url: https://www.ivanti.com/releases/2026/q2
    kind: quarterly platform release summary
    status: 200
  - url: https://www.ivanti.com/support/product-documentation
    kind: documentation index the release notes are published under
    status: 200
entries:
  - version: 25.1.3.0
    date: '2026-07'
    document_revision: '3.0'
    build: '22109'
    breaking: false
    api_affecting: true
    highlights:
      - >-
        Bulk ACL Management Using REST API — create, update and delete multiple Access
        Control Lists in a single API request.
      - >-
        Active User Session API enhancements — the Active User Sessions REST API can now
        filter session data by user.
      - >-
        REST API Diagnostic Logs — a new diagnostic logging capability for system health
        monitoring operations, for troubleshooting REST API calls.
      - >-
        ACME (RFC 8555) support — automated certificate request, domain validation, issuance
        and deployment on the designated interface.
      - >-
        FIDO2 authentication enhancements, including FIDO2 support for the mobile Ivanti
        Secure Access Client.
      - Windows Hello for Business single sign-on enhancements.
      - WebSocket support to backend application servers through a configured HTTP(S) proxy.
      - Default VLAN ID support with IPv6 on internal interfaces.
    companion_versions:
      ics_for_azure: '23409'
      isac: 22.8R7
      mobile_client: 22.8R8
      waf_default_crs: 1.0.4
      default_esap: 4.6.4
  - version: 25.1.1.1
    date: '2026-05'
    document_revision: '4.0'
    breaking: false
    highlights:
      - Security enhancement and bug fixes.
  - version: 25.1.1.0
    date: '2026-03'
    document_revision: '3.0'
    breaking: false
    highlights:
      - Updated what's new, known issues and fixed issues.
  - version: 25.1.0.0
    date: '2025-09'
    document_revision: '1.0'
    breaking: false
    highlights:
      - First release of the 25.1 version line.
notes:
  - >-
    Dates are month-precision because the release notes' own revision-history table is
    month-precision; no day-level publication date is published.
  - >-
    The 25.1.3.0 release notes also carry Resolved Issues and Known Issues sections, which
    are the closest thing this product family has to a defect changelog.
